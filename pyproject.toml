[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexopy-assistente-virtual"
version = "1.0.0"
description = "Assistente virtual para estudos em Python e automação."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.44,<2.0",
    "scikit-learn>=1.5,<2.0",
    "pandas>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "google-genai>=2.34,<3.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
