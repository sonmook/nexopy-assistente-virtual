name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Executar testes
        run: pytest -q

      - name: Verificar erros estáticos
        run: ruff check --isolated --select E9,F .

      - name: Avaliar recuperação e conteúdo
        run: python scripts/evaluate.py

      - name: Diagnóstico independente (sem limiar de aprovação)
        run: >-
          python scripts/evaluate.py --cases tests/casos_independentes_v1.json
          --output-dir outputs/independente-v1 --report-only

      - name: Salvar diagnóstico independente
        uses: actions/upload-artifact@v4
        with:
          name: avaliacao-independente-v1
          path: outputs/independente-v1/
